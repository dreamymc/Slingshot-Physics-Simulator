# GitHub Actions Workflow for Slingshot Physics Simulator
# This CI pipeline installs dependencies and runs tests automatically.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Slingshot Physics Simulator CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run tests (if you add test files later, e.g., test_physics.py)
    - name: Run tests
      run: |
        pytest || echo "No tests found, skipping..."
